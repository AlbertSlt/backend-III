paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos (paginado)
      description: >
        Devuelve una pagina de pedidos. El query string se pasa como filtro
        de Mongo (excepto page/limit, que controlan la paginacion), por eso
        se puede filtrar por status (y en general por cualquier campo del
        modelo Order).
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, delivered, cancelled]
          description: Filtra los pedidos por estado. Opcional.
      responses:
        '200':
          $ref: '#/components/responses/OrderListResponse'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtener un pedido por id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          $ref: '#/components/responses/OrderDetailResponse'
        '400':
          $ref: '#/components/responses/InvalidIdResponse'
        '404':
          $ref: '#/components/responses/OrderNotFoundResponse'

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Actualizar el estado de un pedido
      description: >
        Valida el estado enviado contra los estados permitidos antes de
        consultar la base de datos.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OrderStatusUpdatedResponse'
        '400':
          description: >
            Ocurre por dos motivos posibles: el estado enviado no es uno de los estados validos (INVALID_ORDER_STATUS), o el id de la URL no
            tiene formato valido de ObjectId (INVALID_ID).
        '404':
          $ref: '#/components/responses/OrderNotFoundResponse'

  /api/orders/{id}/proof:
    post:
      tags:
        - Orders
      summary: Cargar el comprobante de entrega de un pedido
      description: >
        Sube un archivo (multipart/form-data) y lo asocia como comprobante
        del pedido. Solo se guardan los metadatos en la base de datos (nombre,
        ruta, tipo, tamaño); el archivo en si queda en el servidor. Si el
        pedido ya tenia un comprobante cargado, este endpoint lo reemplaza.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/OrderProofUploadedResponse'
        '400':
          description: >
            Ocurre por varios motivos posibles: no se envio ningun archivo
            (FILE_REQUIRED), el tipo de archivo no esta permitido
            (INVALID_FILE_TYPE), el archivo supera los 5MB (FILE_TOO_LARGE),
            o el id de la URL no tiene formato valido (INVALID_ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/OrderNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'