paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Obtener todos los usuarios
      description: >
        Devuelve la lista completa de usuarios registrados. El query string
        se pasa directo como filtro de Mongo, por eso se puede filtrar por
        role (y en general por cualquier campo del modelo User, excepto
        password que nunca se devuelve).
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [admin, user, courier]
          description: Filtra los usuarios por rol. Opcional.
      responses:
        '200':
          $ref: '#/components/responses/UserListResponse'
    post:
      tags:
        - Users
      summary: Crear un usuario
      description: >
        Crea un nuevo usuario. first_name, last_name, email y password son
        obligatorios. role es opcional (por defecto "user").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '409':
          $ref: '#/components/responses/DuplicateKeyResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Obtener un usuario por id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          $ref: '#/components/responses/UserDetailResponse'
        '400':
          $ref: '#/components/responses/InvalidIdResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
    put:
      tags:
        - Users
      summary: Actualizar un usuario
      description: Se debe enviar al menos uno de los campos actualizables.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserUpdatedResponse'
        '400':
          description: >
            Ocurre por dos motivos posibles: no se envio ningun campo para
            actualizar (VALIDATION_ERROR), o el id de la URL no tiene formato
            valido de ObjectId (INVALID_ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '409':
          $ref: '#/components/responses/DuplicateKeyResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - Users
      summary: Eliminar un usuario
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          $ref: '#/components/responses/UserDeletedResponse'
        '400':
          $ref: '#/components/responses/InvalidIdResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/users/{id}/documents:
    post:
      tags:
        - Users
      summary: Cargar un documento de un usuario
      description: >
        Sube un archivo (multipart/form-data) y lo asocia al usuario. Solo se
        guardan los metadatos en la base de datos (nombre, ruta, tipo,
        tamaño); el archivo en si queda en el servidor. El documento se
        agrega a la lista de documentos del usuario (no reemplaza los
        anteriores). IMPORTANTE: el campo "type" debe enviarse antes que
        "document" en el formulario, para que el servidor elija bien la
        carpeta de destino.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDocumentUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserDocumentUploadedResponse'
        '400':
          description: >
            Ocurre por varios motivos posibles: no se envio ningun archivo
            (FILE_REQUIRED), el tipo de archivo no esta permitido
            (INVALID_FILE_TYPE), el archivo supera los 5MB (FILE_TOO_LARGE),
            el campo type no fue enviado o no es valido
            (INVALID_DOCUMENT_TYPE), o el id de la URL no tiene formato
            valido (INVALID_ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'